<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
</head>
<body>
<p id="message">Checking access...</p>

<script>
const blockedIPs = [
  "196.217.67.169",
  "111.111.111.111",
  "222.222.222.222"
];

// Replace this with your actual link
const targetLink = "https://your-target-link.com";

async function checkIP() {
    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        const userIP = data.ip;

        if(blockedIPs.includes(userIP)) {
            document.getElementById("message").innerText = "Access blocked for your IP.";
        } else {
            window.location.href = targetLink;
        }
    } catch (e) {
        // If API fails, redirect anyway
        window.location.href = targetLink;
    }
}

checkIP();
</script>
</body>
</html>
