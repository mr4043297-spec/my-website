<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script src="https://cdn.jsdelivr.net/npm/geoip-lite@1.5.0/geoip.min.js"></script>
</head>
<body>
    <p id="message">Checking your location...</p>

    <script>
        // Replace this with your actual target link
        const targetLink = "https://www.muscleslotq.com/337X854/NGQ67L/";

        async function redirectUser() {
            try {
                // Get visitor info from free API
                const res = await fetch("https://ipapi.co/json/");
                const data = await res.json();

                if(data.country === "US") {
                    document.getElementById("message").innerText = 
                        "Sorry, this link is not available in your country.";
                } else {
                    window.location.href = targetLink;
                }
            } catch (e) {
                // If API fails, redirect anyway
                window.location.href = targetLink;
            }
        }

        redirectUser();
    </script>
</body>
</html>
