<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
</head>
<body>

<p id="message">Checking access...</p>

<script>
// ===== SETTINGS =====
const blockedIPs = [
  "196.217.67.169",
  "111.111.111.111",
  "222.222.222.222"
];

const targetLink = "https://www.youtube.com/";
// ====================

async function checkAccess() {
    try {
        // Get IP + country in one request
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();

        const userIP = data.ip;
        const country = data.country;

        // Block specific IPs
        if (blockedIPs.includes(userIP)) {
            document.getElementById("message").innerText =
                "Access blocked for your IP.";
            return;
        }

        // Block USA
        if (country === "US") {
            document.getElementById("message").innerText =
                "This link is not available in your country.";
            return;
        }

        // Allow access
        window.location.href = targetLink;

    } catch (e) {
        // If API fails, allow access
        window.location.href = targetLink;
    }
}

checkAccess();
</script>

</body>
</html>
