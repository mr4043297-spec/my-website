<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
</head>
<body>
<p id="message">Checking access...</p>

<script>
// List of specific IPs you want to block
const blockedIPs = [
  "123.123.123.123",
  "111.111.111.111",
  "222.222.222.222"
];

// Replace this with your actual target link
const targetLink = "https://www.amazon.com/";

// Function to check user's IP and country
async function checkAccess() {
    try {
        // Get visitor info
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();

        const userIP = data.ip;
        const userCountry = data.country;

        if(blockedIPs.includes(userIP)) {
            document.getElementById("message").innerText = "Access blocked for your IP.";
        } else if(userCountry === "US") {
            document.getElementById("message").innerText = "Access blocked for your country.";
        } else {
            window.location.href = targetLink;
        }
    } catch (e) {
        // If API fails, redirect anyway
        window.location.href = targetLink;
    }
}

checkAccess();
</script>
</body>
</html>
